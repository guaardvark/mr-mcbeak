# Mr. McBeak configuration

system:
  name: "Mr. McBeak"                # Shown in the banner and given to Whisper as a hint word
  active_timeout_seconds: 30       # Follow-up window without needing wake-word
  default_assistant: "claude"     # Who "Mr. McBeak ..." goes to before any assistant has been used
  log_level: "INFO"
  sound_cues: true                 # Play chimes on wake-word and turn completion
  thinking_cue: true               # Soft pulse while an assistant is working (needs sound_cues)
  thinking_cue_every: 3            # Seconds between pulses; the first comes after half of this
  speak_early: true                # Claude: speak the first sentence while the rest is still being written
  shared_transcript_turns: 6       # How many recent turns of the others each assistant is shown
  remember_conversations: true     # Each assistant carries on its last conversation after a restart (only the
                                   # CLI's conversation id is saved, in ~/.local/state/mcbeak/sessions.json)
  remember_hours: 72               # ... if it was used within this many hours; "new conversation" forgets it

audio:
  sample_rate: 16000
  channels: 1
  silence_threshold: 0.015         # Energy threshold for speech detection
  silence_duration_ms: 1800        # Silence that ends an utterance when the end-of-turn model is off or missing
  turn_detection: true             # Smart Turn v3.2 (local, CPU) decides from how a pause sounds whether you finished
  turn_check_ms: 500               # Pause after which the model is asked
  turn_threshold: 0.7              # How sure it must be that you finished. Real English speech (pipecat's
                                   # test set, 538 clips), asked 0.5 s after the last word: 0.7 caught 96.0%
                                   # of finished turns and cut 4.6% of unfinished ones; 0.5 caught 96.8%, cut 8.0%
  max_silence_ms: 3000             # Longest wait when you sound mid-thought
  min_speech_duration_ms: 400      # Minimum speech duration to discard noise
  max_utterance_seconds: 30        # Maximum recording duration before auto-segmenting
  max_queue_age_seconds: 8         # Speech heard while an assistant was busy is dropped after this
  preroll_ms: 500                  # Audio kept from just before speech starts, so soft first words survive
  continuation_seconds: 4          # Speech this soon after your last word, before the reply was fully spoken, continues the same question
  barge_in_enabled: true           # Interrupt assistant when user speaks

emotion:
  enabled: true                    # Tone of voice from the audio (emotion2vec+ large, local CPU, ~70 ms, run
                                   # alongside transcription). A clear non-neutral reading goes to the assistant
                                   # with your words as a hint, e.g. "sounds annoyed or angry", and shows on screen.
  threshold: 0.8                   # CREMA-D test (actors, 1117 clips): 82% of emotional clips got the right hint,
                                   # 7% of neutral ones a hint; 0.6 gave 85% and 9%

stt:
  engine: "faster_whisper"         # faster_whisper
  model_size: "large-v3-turbo"     # Measured 2026-11-10 on the GPU, int8, names as a lead-in sentence:
                                   # LibriSpeech test.other word errors 5.9% (small.en 10.4%), spoken
                                   # commands routed right 39/40 (small.en with hotwords 36/40), false
                                   # wakes on unaddressed speech 1/200 (6/200), ~95 ms per clip (~70 ms).
                                   # About 1 GB of GPU memory. small.en still works on a CPU-only box.
  hint_style: "lead_in"            # lead_in (names as a sentence Whisper reads first) or hotwords
  name_check_model: "small.en"     # Listens again when the main model heard no name; empty turns it off.
                                   # 160 synthetic commands: turbo alone routed 153 right, small.en alone
                                   # 158, together 159; LibriSpeech word errors 6.0%, false wakes 3/200
  device: "auto"                   # auto, cuda, or cpu
  compute_type: "int8"             # int8 works on CPU and CUDA; float16 measured no faster
  beam_size: 5
  vad_filter: true                 # Built-in Silero VAD (do not retry without VAD — that yields "you")

tts:
  engine: "piper"                  # piper
  models_dir: "models/piper"       # relative to this folder, or absolute
  extra_model_dirs: []             # e.g. ["~/guaardvark/backend/tools/voice/piper-models"]
  playback_speed: 1.05             # Slight speed boost for snappy conversations
  sentence_streaming: true         # Synthesize and play sentence-by-sentence

# Assistant Definitions & Wake Word Mapping
#
# These describe each kind of assistant. Until you shape your own team, the team
# is every assistant below whose program is installed. `mcbeak team add NAME KIND`
# (or "Mr. McBeak, ask Grok to join") starts your own team file,
# ~/.config/mcbeak/team.yaml, and from then on that file says who is on the team.
#
# Per assistant, optional keys:
#   permissions: readonly | full   readonly (default) = the CLI may read and answer, not edit or run
#   model:       CLI model override (Claude: e.g. claude-haiku-5-5 for cheaper, faster spoken turns)
#   workspace:   directory the CLI runs in (default: where Mr. McBeak was launched)
#   timeout_seconds: per-turn limit (default 120)
assistants:
  claude:
    name: "Claude Code"
    target_id: "claude"
    cli_cmd: "claude"
    mode: "headless"               # headless or tmux
    mcp: "none"                    # MCP servers on voice turns: all, none, or a list such as ["guaardvark"].
                                   # "none" saved ~1.4 s and ~$0.05 per turn (measured 2026-11-10)
    permissions: "full"        # "full" lets voice commands edit files and run commands
    keep_alive: true               # One claude process per Claude member stays up between questions instead of
                                   # starting for each one. Measured 2026-11-19 with Haiku on short questions:
                                   # 0.62 s a turn against 1.14 s. Each kept process holds about 220 MB of
                                   # memory; false on a small machine with several Claude members
    wake_words:
      - "claude"
      - "hey claude"
      - "ok claude"
      - "yo claude"
      - "hello claude"
    phonetic_variants:
      - "clod"
      - "clawed"
      - "claud"
      - "cloud"
    voice: "kokoro:am_michael"     # Kokoro v1.0, male; 65/67 words heard vs 63 for Piper LibriTTS #430
    voice_speaker: 0               # (multi-speaker Piper models only). Back to Piper: "en_US-libritts-high.onnx", 430
    prompt_prefix: ""
    description: "Deep reasoning, full codebase refactoring & planning"

  grok:
    name: "Grok"
    target_id: "grok"
    cli_cmd: "grok"
    mode: "headless"
    permissions: "full"
    wake_words:
      - "grok"
      - "hey grok"
      - "ok grok"
      - "yo grok"
      - "hello grok"
    phonetic_variants:
      - "grock"
      - "croc"
      - "brock"
      - "grut"
      - "groot"
    voice: "en_US-libritts-high.onnx"   # distinct from Claude's voice for group chat
    voice_speaker: 3
    prompt_prefix: ""
    description: "Fast implementation, web-aware problem solver"

  antigravity:
    name: "Antigravity"
    target_id: "agy"
    cli_cmd: "agy"
    mode: "headless"
    wake_words:
      - "antigravity"
      - "anti gravity"
      - "agy"
      - "a g y"
      - "hey antigravity"
      - "hey agy"
      - "ok antigravity"
    phonetic_variants:
      - "gravity"
      - "anti-gravity"
      - "a.g.y."
    voice: "en_US-ryan-high.onnx"
    voice_speaker: 0
    prompt_prefix: ""
    description: "Google DeepMind Agentic CLI with skills & subagents"

  cursor:
    name: "Cursor Agent"
    target_id: "cursor"
    cli_cmd: "agent"               # the Cursor Agent CLI binary name
    mode: "headless"
    wake_words:
      - "cursor"
      - "hey cursor"
      - "ok cursor"
      - "yo cursor"
      - "hello cursor"
    phonetic_variants:
      - "curser"
      - "cursir"
    voice: "en_US-libritts-high.onnx"
    voice_speaker: 24
    prompt_prefix: ""
    description: "Cursor AI Agent for rapid code generation & edits"

  codex:
    name: "Codex"
    target_id: "codex"
    cli_cmd: "codex"               # OpenAI Codex CLI; analytics, feedback and OTel export are switched off per call
    mode: "headless"
    permissions: "readonly"        # readonly = Codex's read-only sandbox; full = it may write inside its workspace
    wake_words:
      - "codex"
      - "hey codex"
      - "ok codex"
      - "yo codex"
      - "hello codex"
    phonetic_variants:
      - "codecs"
      - "kodex"
      - "code x"
      - "codec"
    voice: "kokoro:bm_george"      # British male, so Codex is easy to tell apart
    voice_speaker: 0
    description: "OpenAI Codex CLI"

  guaardvark:
    name: "Guaardvark"
    target_id: "guaardvark"
    cli_cmd: "guaardvark"
    mode: "headless"
    api_url: "http://127.0.0.1:5000/api/enhanced-chat"   # synchronous chat; the CLI is the fallback
    permissions: "full"            # Guaardvark has no read-only mode, so read-only made it refuse every request
    use_rag: false                 # true = search indexed documents on every spoken turn (slower)
    wake_words:
      - "guaardvark"
      - "hey guaardvark"
      - "ok guaardvark"
      - "yo guaardvark"
    phonetic_variants:
      - "guard vark"
      - "guardvark"
      - "guad vark"
      - "godvark"
      - "guard bark"
      - "wardvark"        # whisper hears a soft g as w
      - "ward vark"
      - "waradvark"
    voice: "en_US-libritts-high.onnx"
    voice_speaker: 42
    prompt_prefix: ""
    description: "Local Guaardvark autonomous AI operating system"

# The app's own name: routes to the last assistant used, or default_assistant.
# Lead with "Mr." or "Mister": on its own "McBeak" was heard right less often
# (15 of 18 synthetic test clips against 18 of 18).
coordinator_wake_words:
  - "mr mcbeak"
  - "mister mcbeak"
  - "hey mr mcbeak"
  - "hey mister mcbeak"
  - "ok mr mcbeak"
# What Whisper wrote for it without hint words, plus the bare surname
coordinator_variants:
  - "mcbeak"
  - "mr mcbeek"
  - "mister mcbeek"
  - "mr mcgeek"
  - "mr mcveeke"
  - "mr mc beak"

# Group conversation: everyone answers, each in their own voice, and each sees
# what the others said. Follow-ups within the window keep going to the team.
council:
  wake_words:
    - "team"
    - "hey team"
    - "ok team"
    - "everyone"
    - "hey everyone"
  members: ["claude", "grok", "antigravity", "cursor", "codex", "guaardvark"]   # with a team file: everyone in it
  parallel: true
  reply_order: completion         # completion (fastest first) or member (configured order)
